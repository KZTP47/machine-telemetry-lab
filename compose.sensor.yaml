services:
  broker:
    ports:
      - "${EDGE_MQTT_BIND:-127.0.0.1}:8883:8883"
    environment:
      EMQX_LISTENERS__SSL__DEFAULT__BIND: "0.0.0.0:8883"
      EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__CACERTFILE: /opt/emqx/certs/sensor/ca.pem
      EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__CERTFILE: /opt/emqx/certs/sensor/server.pem
      EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__KEYFILE: /opt/emqx/certs/sensor/server.key
      EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__VERIFY: verify_peer
      EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__FAIL_IF_NO_PEER_CERT: "true"
    volumes:
      - type: bind
        source: "${MQTT_BROKER_CERT_DIR:?Set MQTT_BROKER_CERT_DIR to the broker certificate folder}"
        target: /opt/emqx/certs/sensor
        read_only: true
