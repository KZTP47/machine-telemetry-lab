name: Demo integration

on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: backend
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: KZTP47/machine-telemetry-edge
          ref: a2e0b7f7b8cf62a537aaaaf2ea85af7f09fdb01f
          path: edge
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
      - name: Make temporary TLS certificates
        run: |
          work="$RUNNER_TEMP/machine-lab-certs"
          bash tests/create_test_certs.sh "$work"
          echo "MQTT_BROKER_CERT_DIR=$work/broker" >> "$GITHUB_ENV"
      - name: Build and start the services
        run: docker compose -f compose.yaml -f compose.sensor.yaml up --build -d
      - name: Verify MQTT delivery, readings and alerts
        run: docker compose -f compose.yaml -f compose.sensor.yaml run --build --rm integration
      - name: Verify the external publisher and sensor input
        run: bash tests/run_edge_checks.sh ../edge "$RUNNER_TEMP/machine-lab-certs"
      - name: Show service logs on failure
        if: failure() && env.MQTT_BROKER_CERT_DIR != ''
        run: docker compose -f compose.yaml -f compose.sensor.yaml logs --no-color
      - name: Remove demo containers and volumes
        if: always() && env.MQTT_BROKER_CERT_DIR != ''
        run: docker compose -f compose.yaml -f compose.sensor.yaml down --volumes
